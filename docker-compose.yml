version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifedesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifedesk_user
      POSTGRES_PASSWORD: lifedesk_secure_password
      POSTGRES_DB: lifedesk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifedesk_user -d lifedesk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
